<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PseudoFlix - Início</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">PseudoFlix</div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Pesquisar filmes por título ou gênero...">
        </div>
        <div class="user-area">
            <span id="user-name"></span>
            <button class="btn-link" id="logout-btn">Sair</button>
        </div>
    </header>

    <p class="status-message" id="status-message"></p>

    <!-- Visualização padrão: fileiras -->
    <div id="rows-wrapper">
        <div class="row-section">
            <h3 class="row-title">Recomendados para você <span class="row-tag">Neo4j</span></h3>
            <div class="row-container" id="row-recommended"></div>
        </div>

        <div class="row-section" id="section-history" hidden>
            <h3 class="row-title">Assistidos recentemente</h3>
            <div class="row-container" id="row-history"></div>
        </div>

        <div class="row-section">
            <h3 class="row-title">Mais curtidos</h3>
            <div class="row-container" id="row-popular"></div>
        </div>

        <!-- Fileiras por gênero são criadas dinamicamente -->
        <div id="genre-rows"></div>
    </div>

    <!-- Resultados da pesquisa -->
    <div id="search-results-section">
        <h3 class="row-title" id="search-title">Resultados da Pesquisa</h3>
        <div class="movies-grid" id="search-grid"></div>
    </div>

    <!-- MODAL DO FILME -->
    <div class="modal-overlay" id="movie-modal">
        <div class="modal-content">
            <button class="modal-close-btn" id="modal-close" aria-label="Fechar">&times;</button>
            <div class="modal-header-banner" id="modal-media-container"></div>
            <div class="modal-body">
                <div class="modal-left">
                    <h2 id="modal-title"></h2>
                    <div class="modal-meta" id="modal-meta"></div>
                    <div class="modal-actions">
                        <button class="action-btn play" id="btn-play">▶ Assistir</button>
                        <button class="action-btn" id="btn-like" title="Gostei">👍 <span id="like-count">0</span></button>
                        <button class="action-btn" id="btn-dislike" title="Não gostei">👎 <span id="dislike-count">0</span></button>
                    </div>
                    <p class="modal-synopsis" id="modal-synopsis"></p>
                </div>
                <div class="modal-right">
                    <h4>Direção / Produção</h4>
                    <p id="modal-director"></p>
                    <br>
                    <h4>Gêneros</h4>
                    <p id="modal-genres"></p>
                    <br>
                    <h4>Fonte</h4>
                    <p><a id="modal-source" target="_blank" rel="noopener">Internet Archive — domínio público</a></p>
                </div>
            </div>
            <div class="modal-similar">
                <h4>Quem curtiu este também curtiu</h4>
                <div class="row-container small" id="row-similar"></div>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        const user = Auth.getUser();
        if (!user) window.location.href = 'login.html';

        document.getElementById('user-name').textContent = `Olá, ${user?.username || ''}`;
        document.getElementById('logout-btn').addEventListener('click', Auth.logout);

        let allMovies = [];
        let interactions = { liked: [], disliked: [], watched: [] };
        let currentMovie = null;

        const $ = id => document.getElementById(id);
        const statusMsg = $('status-message');
        const showStatus = (text) => { statusMsg.textContent = text; statusMsg.hidden = !text; };

        // ---------- Cards ----------
        function createMovieCard(movie, reason) {
            const card = document.createElement('div');
            card.className = 'movie-card';

            const img = document.createElement('img');
            img.src = movie.posterUrl;
            img.alt = movie.title;
            img.loading = 'lazy';
            img.onerror = () => { img.remove(); card.classList.add('no-poster'); };
            card.appendChild(img);

            const badge = document.createElement('span');
            badge.className = 'card-badge';
            if (interactions.liked.includes(movie.id)) badge.textContent = '👍';
            else if (interactions.disliked.includes(movie.id)) badge.textContent = '👎';
            else if (interactions.watched.includes(movie.id)) badge.textContent = '✓';
            if (badge.textContent) card.appendChild(badge);

            const info = document.createElement('div');
            info.className = 'movie-info';
            const title = document.createElement('strong');
            title.textContent = movie.title;
            info.appendChild(title);
            if (reason) {
                const r = document.createElement('small');
                r.textContent = reason;
                info.appendChild(r);
            }
            card.appendChild(info);

            card.addEventListener('click', () => openMovieModal(movie.id));
            return card;
        }

        function fillRow(container, movies, withReason = false) {
            container.innerHTML = '';
            if (!movies.length) {
                container.innerHTML = '<p class="empty">Nada por aqui ainda.</p>';
                return;
            }
            movies.forEach(m => container.appendChild(createMovieCard(m, withReason ? m.reason : null)));
        }

        // ---------- Carregamento ----------
        async function loadInteractions() {
            interactions = await api.get(`/api/users/${user.id}/interactions`);
        }

        async function loadPersonalRows() {
            const [recs, history] = await Promise.all([
                api.get(`/api/users/${user.id}/recommendations?limit=15`),
                api.get(`/api/users/${user.id}/history?limit=6`)
            ]);
            fillRow($('row-recommended'), recs, true);
            $('section-history').hidden = history.length === 0;
            fillRow($('row-history'), history);
        }

        async function loadCatalog() {
            const [movies, popular, genres] = await Promise.all([
                api.get('/api/movies'),
                api.get('/api/movies/popular?limit=15'),
                api.get('/api/genres')
            ]);
            allMovies = movies;
            fillRow($('row-popular'), popular);

            const wrapper = $('genre-rows');
            wrapper.innerHTML = '';
            genres.forEach(g => {
                const section = document.createElement('div');
                section.className = 'row-section';
                const h = document.createElement('h3');
                h.className = 'row-title';
                h.textContent = g.name;
                const row = document.createElement('div');
                row.className = 'row-container';
                section.append(h, row);
                wrapper.appendChild(section);
                fillRow(row, movies.filter(m => m.genres.includes(g.name)));
            });
        }

        async function init() {
            try {
                await loadInteractions();
                await Promise.all([loadCatalog(), loadPersonalRows()]);
                if (allMovies.length === 0) {
                    showStatus('Nenhum filme no banco. Rode "npm run seed" na pasta backend.');
                } else {
                    showStatus('');
                }
            } catch (err) {
                if (/Usuário não encontrado/.test(err.message)) return Auth.logout();
                showStatus(err.message);
            }
        }

        // Depois de like/dislike/assistir, atualiza o que depende do usuário
        async function refreshAfterAction() {
            await loadInteractions();
            await Promise.all([loadPersonalRows(), loadCatalog()]);
        }

        // ---------- Modal ----------
        const modal = $('movie-modal');
        const media = $('modal-media-container');

        function showPoster(movie) {
            media.innerHTML = '';
            const img = document.createElement('img');
            img.src = movie.posterUrl;
            img.alt = movie.title;
            const play = document.createElement('button');
            play.className = 'big-play';
            play.textContent = '▶';
            play.setAttribute('aria-label', 'Assistir');
            play.addEventListener('click', playMovie);
            media.append(img, play);
        }

        function updateRatingButtons() {
            const id = currentMovie.id;
            $('btn-like').classList.toggle('active', interactions.liked.includes(id));
            $('btn-dislike').classList.toggle('active', interactions.disliked.includes(id));
            $('like-count').textContent = currentMovie.likes;
            $('dislike-count').textContent = currentMovie.dislikes;
        }

        async function openMovieModal(movieId) {
            try {
                currentMovie = await api.get(`/api/movies/${encodeURIComponent(movieId)}`);
            } catch (err) { return showStatus(err.message); }

            const m = currentMovie;
            $('modal-title').textContent = m.title;
            $('modal-meta').textContent = [m.genres.join(', '), m.year, m.runtime].filter(Boolean).join(' • ');
            $('modal-synopsis').textContent = m.synopsis;
            $('modal-director').textContent = m.director || 'Não informado';
            $('modal-genres').textContent = m.genres.join(', ');
            $('modal-source').href = m.pageUrl || '#';
            showPoster(m);
            updateRatingButtons();
            modal.style.display = 'flex';

            const similar = await api.get(`/api/movies/${encodeURIComponent(m.id)}/similar`).catch(() => []);
            fillRow($('row-similar'), similar, true);
        }

        function closeMovieModal() {
            modal.style.display = 'none';
            media.innerHTML = ''; // para o vídeo
        }

        async function playMovie() {
            const m = currentMovie;
            media.innerHTML = `<iframe allow="autoplay; fullscreen" allowfullscreen></iframe>`;
            media.querySelector('iframe').src = m.videoUrl + '?autoplay=1';
            try {
                await api.post('/api/watch', { userId: user.id, movieId: m.id });
                refreshAfterAction();
            } catch (err) { showStatus(err.message); }
        }

        async function rate(kind) {
            const m = currentMovie;
            const already = kind === 'like' ? interactions.liked.includes(m.id) : interactions.disliked.includes(m.id);
            const rating = already ? 'none' : kind; // clicar de novo remove a avaliação
            try {
                await api.post('/api/rate', { userId: user.id, movieId: m.id, rating });
                currentMovie = await api.get(`/api/movies/${encodeURIComponent(m.id)}`);
                await refreshAfterAction();
                updateRatingButtons();
            } catch (err) { showStatus(err.message); }
        }

        $('btn-play').addEventListener('click', playMovie);
        $('btn-like').addEventListener('click', () => rate('like'));
        $('btn-dislike').addEventListener('click', () => rate('dislike'));
        $('modal-close').addEventListener('click', closeMovieModal);
        modal.addEventListener('click', e => { if (e.target === modal) closeMovieModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMovieModal(); });

        // ---------- Pesquisa ----------
        const searchInput = $('search-input');
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const rowsWrapper = $('rows-wrapper');
            const results = $('search-results-section');

            if (query === '') {
                rowsWrapper.style.display = 'block';
                results.style.display = 'none';
                return;
            }
            rowsWrapper.style.display = 'none';
            results.style.display = 'block';

            const filtered = allMovies.filter(m =>
                m.title.toLowerCase().includes(query) ||
                m.genres.some(g => g.toLowerCase().includes(query))
            );
            $('search-title').textContent = `Resultados para: "${e.target.value}" (${filtered.length})`;
            const grid = $('search-grid');
            grid.innerHTML = '';
            if (filtered.length === 0) {
                grid.innerHTML = '<p class="empty">Nenhum filme encontrado.</p>';
                return;
            }
            filtered.forEach(m => grid.appendChild(createMovieCard(m)));
        });

        if (user) init();
    </script>
</body>
</html>
